plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"player_to_player" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:5.10.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

// 独立计算服务端使用 Loom 的真实 server 运行配置；不能借用客户端的 named/client-only
// 类路径，也不能让远端下发的脚本决定本机开发进程的启动参数。描述只写入生成目录。
def workerLaunchSpec = layout.buildDirectory.file('p2p/worker-launch.json')
tasks.register('writeWorkerLaunchSpec') {
	group = 'fabric'
	description = 'Exports the local Loom server launch configuration for isolated P2P workers.'
	dependsOn tasks.named('configureLaunch'), tasks.named('classes')
	outputs.file(workerLaunchSpec)
	doLast {
		def launch = tasks.named('runServer').get()
		def destination = workerLaunchSpec.get().asFile
		destination.parentFile.mkdirs()
		destination.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
			classpath: launch.classpath.asPath,
			mainClass: launch.mainClass.get(),
			jvmArguments: launch.allJvmArgs
		])), 'UTF-8')
	}
}
tasks.named('runClient') {
	dependsOn tasks.named('writeWorkerLaunchSpec')
	jvmArgs '-Dp2p.worker.developmentSpec=' + workerLaunchSpec.get().asFile.absolutePath
}

// 显式开启的真实子进程冒烟；正常单元测试不会额外启动 Minecraft。
if (providers.gradleProperty('p2pWorkerSmoke').isPresent()) {
	tasks.named('test') {
		dependsOn tasks.named('writeWorkerLaunchSpec')
		systemProperty 'p2p.worker.smoke', 'true'
		systemProperty 'p2p.worker.developmentSpec', workerLaunchSpec.get().asFile.absolutePath
	}
}

processResources {
	// Gradle 进程使用系统原生编码时，资源模板仍固定按 UTF-8 读取，避免中文内容损坏。
	filteringCharset = "UTF-8"

	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	// 源码统一为 UTF-8；不能继承用于兼容 Windows worker 参数文件的系统原生编码。
	it.options.encoding = "UTF-8"
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
